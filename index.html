<title>Broader Horizons Editorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: International Typographic Style. Flush-left grotesque on a strict column, hairline rules instead of boxes, square corners, no shadows. White ground, ink, one blue, gold used only for the sun and the pins. */
:root{--bg:#fbfaf7;--card:#ffffff;--ink:#1d2430;--sub:#5f6b7d;--line:#d9dde4;--field:#ffffff;--btnink:#ffffff;--blue:#1f4fa0;--blue-d:#173b7a;--bluetint:#e9eff9;--bluetext:#1f4fa0;--gold:#c58a00;--gold-d:#9e6f00;--goldtint:#fbf1d6;--goldtext:#6b4a00;--err:#b42318;--sky:#f3f7fd;--sea:#cfe0f5;--sea2:#b4cdee;--land:#ffffff;--landedge:#1d2430;--pin:#c58a00;--pinoff:#8b94a3;--pinedge:#1d2430;--mapink:#1d2430;--label:#5f6b7d;--display:"Plus Jakarta Sans","Hanken Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161d;--card:#1a2029;--ink:#eef1f6;--sub:#9aa4b5;--line:#2c3441;--field:#12161d;--btnink:#12161d;--blue:#7ca7f0;--blue-d:#9dbcf5;--bluetint:#1c2740;--bluetext:#9dbcf5;--gold:#e2b13c;--gold-d:#c99a2a;--goldtint:#2f2813;--goldtext:#e2b13c;--err:#ff8a80;--sky:#161d2b;--sea:#1d3556;--sea2:#2b4a78;--land:#1a2029;--landedge:#eef1f6;--pin:#e2b13c;--pinoff:#6f7a8c;--pinedge:#eef1f6;--mapink:#eef1f6;--label:#9aa4b5;color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#12161d;--card:#1a2029;--ink:#eef1f6;--sub:#9aa4b5;--line:#2c3441;--field:#12161d;--btnink:#12161d;--blue:#7ca7f0;--blue-d:#9dbcf5;--bluetint:#1c2740;--bluetext:#9dbcf5;--gold:#e2b13c;--gold-d:#c99a2a;--goldtint:#2f2813;--goldtext:#e2b13c;--err:#ff8a80;--sky:#161d2b;--sea:#1d3556;--sea2:#2b4a78;--land:#1a2029;--landedge:#eef1f6;--pin:#e2b13c;--pinoff:#6f7a8c;--pinedge:#eef1f6;--mapink:#eef1f6;--label:#9aa4b5;color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--display);padding-inline:16px;font-feature-settings:"tnum" 1}
h1,h2,h3{font-weight:800;line-height:1.05;margin:0 0 .6rem;text-wrap:balance;letter-spacing:-.025em}
h2{font-size:clamp(1.8rem,4vw,2.6rem)}h3{font-size:1.15rem;letter-spacing:-.01em;line-height:1.25}
p{margin:.4rem 0}
.wrap{max-width:1040px;margin:0 auto;padding-block:8px 80px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px 22px;align-items:center;flex-wrap:wrap;max-width:1040px;margin:0 auto;padding-block:14px 12px;border-bottom:2px solid var(--ink)}
#navtabs{gap:6px 24px}
nav .brand{font-weight:800;font-size:1.05rem;margin-right:auto;background:none;border:0;color:var(--ink);cursor:pointer;padding:4px 0;letter-spacing:-.02em}
nav button.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--sub);font:inherit;font-weight:500;padding:4px 0;cursor:pointer;margin-bottom:-14px;padding-bottom:12px}
nav button.tab.on{color:var(--ink);border-bottom-color:var(--blue)}
.count{display:inline-block;min-width:1.4em;text-align:center;font-size:.75rem;font-weight:700;background:var(--ink);color:var(--bg);padding:0 5px;margin-left:6px}
.avatar{width:26px;height:26px;background:var(--gold);color:#111214;font-weight:800;font-size:.85rem;display:inline-grid;place-items:center;vertical-align:middle}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,.pin:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn{font:inherit;font-weight:700;font-size:.95rem;border:2px solid var(--blue);border-radius:0;padding:12px 22px;cursor:pointer;background:var(--blue);color:var(--btnink)}
.btn:hover{background:var(--blue-d);border-color:var(--blue-d)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#111214}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:.85rem}
.btn.big{padding:16px 28px;font-size:1.05rem}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.panel{border-top:2px solid var(--ink);padding:20px 0 4px;margin-block:20px}
label{display:block;font-weight:600;font-size:.88rem;margin:18px 0 6px}
.hint{font-weight:400;color:var(--sub)}
input,select{width:100%;font:inherit;padding:11px 12px;border-radius:0;border:1px solid var(--ink);background:var(--field);color:var(--ink)}
input:focus,select:focus{outline:3px solid var(--blue);outline-offset:0}
input[type=checkbox]{width:auto;accent-color:var(--blue)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-block:8px}
.chip{border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:0;padding:6px 14px;font:inherit;font-weight:500;font-size:.92rem;cursor:pointer}
.chip:hover{background:var(--bluetint)}
.chip.on{background:var(--ink);color:var(--bg)}
.seg{display:flex;gap:0;margin-block:14px}.seg .chip{flex:0 0 auto;padding:10px 20px;margin-right:-1px}
.card{border-top:2px solid var(--ink);padding:16px 0 18px;margin-block:0;min-width:0}
.card .top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}
.card h3{min-width:0;font-size:1.3rem}
.amt{font-weight:800;white-space:nowrap;color:var(--ink);font-size:1.15rem;letter-spacing:-.01em}
.tags{display:flex;gap:2px 14px;flex-wrap:wrap;margin-block:2px 8px}
.tag{font-size:.85rem;font-weight:500;color:var(--sub)}
.tag.g{color:var(--blue);font-weight:700}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 24px;font-size:.92rem;margin-block:10px;padding-block:10px;border-block:1px solid var(--line)}.facts span{color:var(--sub);display:block;font-size:.8rem}
.why{font-size:.9rem;margin-block:8px;padding:6px 0 6px 12px;border-left:4px solid var(--gold)}
.why.no{border-left-color:var(--line);color:var(--sub)}
.stat{font-weight:600}.stat b.past{color:var(--ink)}.stat b.open{color:var(--blue)}
.muted{color:var(--sub);font-size:.9rem}
.contact{font-size:.9rem;margin-top:10px;overflow-wrap:anywhere}
.contact.need{padding-left:12px;border-left:4px solid var(--gold)}
details{margin-top:10px;font-size:.95rem}summary{cursor:pointer;color:var(--blue);font-weight:700}
.sub{border-top:1px solid var(--line);margin-top:8px;padding-top:8px}
a{color:var(--blue);font-weight:600;text-underline-offset:3px}
.save{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:0;padding:5px 12px;font:inherit;font-size:.88rem;font-weight:600;cursor:pointer;white-space:nowrap}
.save svg{width:13px;height:13px}.save path{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linejoin:miter}
.save[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#111214}.save[aria-pressed="true"] path{fill:currentColor}
.actions{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:14px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-top:2px solid var(--ink);padding-block:14px;margin-block:16px}
.empty{padding:36px 0;color:var(--sub)}
.lnk{all:unset;cursor:pointer;color:var(--ink);text-decoration:underline;text-decoration-color:var(--gold);text-decoration-thickness:3px;text-underline-offset:4px;font-weight:800;letter-spacing:-.01em}.lnk:hover{color:var(--blue)}.lnk:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
a.btn{text-decoration:none;display:inline-block;color:var(--btnink)}a.btn.ghost{color:var(--ink)}a.btn.ghost:hover{color:var(--bg)}a.btn.block{display:block;text-align:center;margin-top:10px}
.detail{margin-top:18px}.detail h2{margin:6px 0 4px}.detail h3{margin:22px 0 6px;border-top:1px solid var(--line);padding-top:14px}.detail ul{padding-left:1.1rem;margin:6px 0}.detail li{margin:4px 0}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:0 36px;align-items:start}.side{border-top:2px solid var(--ink);padding-top:12px;position:sticky;top:70px}.side h3{margin:0 0 4px;border:0;padding:0}
@media(max-width:760px){.dgrid{grid-template-columns:1fr}.side{position:static;order:-1;margin-block:12px}}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}.tagchip{display:inline-block;font:inherit;font-size:.8rem;font-weight:600;border:1px solid var(--line);background:var(--bluetint);color:var(--bluetext);padding:2px 10px;border-radius:0;cursor:default}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 24px}.stats div{border-top:2px solid var(--ink);padding:12px 0}.stats b{display:block;font-size:2.4rem;letter-spacing:-.04em;line-height:1}.stats span{color:var(--sub);font-size:.9rem}
table.t{width:100%;border-collapse:collapse;font-size:.92rem;margin-block:8px}table.t th,table.t td{text-align:left;padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}table.t th{font-size:.78rem;color:var(--sub);text-transform:uppercase;letter-spacing:.04em}
.bar{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.bar i{display:block;height:6px;background:var(--line)}.bar i.on{background:var(--gold)}
.err{color:var(--err);font-weight:600;min-height:1.4em}
.ok{color:var(--blue);font-weight:600}
/* welcome poster */
.scene{background:var(--sky);position:relative;overflow:hidden;min-height:clamp(380px,56vw,540px);margin-top:20px;border-bottom:2px solid var(--ink)}
.scene svg{position:absolute;inset:0;width:100%;height:100%}
.scene .say{position:relative;z-index:1;padding:20px 0 0;max-width:640px}
.scene .word{font-weight:800;font-size:clamp(2.6rem,9.5vw,6.2rem);letter-spacing:-.045em;line-height:.9}
.scene .tagline{font-weight:500;font-size:clamp(1.05rem,2.4vw,1.5rem);margin-top:18px;max-width:22ch;line-height:1.2}
.scene{--x:0}@media(max-width:640px){.scene{min-height:440px}}
.cta{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;margin-block:26px 8px}
.lede{max-width:56ch;color:var(--sub)}
/* map */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-block:12px}
.toolbar .grow{flex:1}
.mapbox{overflow:hidden;border:1px solid var(--ink);background:var(--sea)}
.mapbox svg{display:block;width:100%;height:auto;max-height:70vh;margin-inline:auto}
#mapwrap.fs{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));padding-top:calc(12px + env(safe-area-inset-top,0px));overflow:hidden}
#mapwrap.fs .mapbox{flex:1;min-height:0;margin-bottom:6px}
#mapwrap.fs .mapbox svg{height:100%;max-height:none}
#mapwrap.fs #detail{max-height:36vh;overflow:auto}
#mapwrap.fs #detail .panel{margin-block:8px 0}
.pin{cursor:pointer}
.pin .ring{fill:none;stroke:var(--blue);stroke-width:3;opacity:0}
.pin.sel .ring{opacity:1}
.pill{display:inline-block;align-self:flex-start;white-space:nowrap;font-size:.85rem;font-weight:700;padding:2px 0}
.pill.off{color:var(--ink);box-shadow:inset 0 -6px 0 var(--gold)}.pill.can{color:var(--sub);text-decoration:line-through}
.plist{display:flex;flex-wrap:wrap;gap:0;margin-block:12px;border-top:1px solid var(--ink)}
.plist button{font:inherit;font-weight:600;font-size:.9rem;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 16px 8px 0;cursor:pointer;text-align:left;flex:1 1 220px}
.plist button.on{box-shadow:inset 4px 0 0 var(--gold);padding-left:12px}
.plist button.can{color:var(--sub)}

/* ---- shared softening ---- */
input,select{border-radius:12px;border:1px solid var(--line)}input:focus,select:focus{outline:3px solid color-mix(in srgb,var(--blue) 35%,transparent);outline-offset:1px}
.btn,.btn.sm,.btn.big,.save,.chip,.seg .chip{border-radius:999px}
.seg{gap:6px}.seg .chip{margin-right:0}
.tagchip{border-radius:999px}
.lnk{text-decoration-thickness:2px}
.mapbox{border-radius:18px}
.why{border-left:0;border-radius:12px;background:var(--goldtint);padding:8px 12px}.why.no{background:var(--bluetint)}
.pill.off{box-shadow:none;background:var(--goldtint);padding:2px 10px;border-radius:999px;color:var(--goldtext)}
.plist{border-top:0}.plist button{border-bottom:0;border-radius:12px;background:var(--card);margin:3px 6px 3px 0;padding:10px 14px;flex:1 1 220px}.plist button.on{box-shadow:inset 0 0 0 2px var(--gold);padding-left:14px}
.stats div{border-top:0}
table.t th,table.t td{border-color:var(--line)}

:root{--bg:#f3f7fd;--shadow:0 1px 2px rgba(31,79,160,.06),0 10px 30px rgba(31,79,160,.09)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--shadow:0 10px 30px rgba(0,0,0,.35);--bg:#12161d}}
:root[data-theme="dark"]{--shadow:0 10px 30px rgba(0,0,0,.35);--bg:#12161d}
body{background:var(--bg)}
nav{border-bottom:0;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);box-shadow:var(--shadow);border-radius:0 0 22px 22px;padding-inline:18px;margin-bottom:6px}
nav button.tab{border:0;border-radius:999px;padding:8px 16px;margin:0}
nav button.tab.on{background:var(--bluetint);color:var(--blue);border:0}
.panel{border:0;background:var(--card);border-radius:22px;padding:22px 24px;box-shadow:var(--shadow)}
.card{background:var(--card);border:0;border-radius:22px;padding:22px 24px;margin-block:16px;box-shadow:var(--shadow)}
.card h3{font-size:1.2rem}
.facts{border:0;background:var(--sky);border-radius:14px;padding:12px 16px}
.scene{border:0;border-radius:30px;margin-top:22px}
.say .word,.scene .word{letter-spacing:-.035em}
.side{border:0;background:var(--card);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.stats div{background:var(--card);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.detail h3{border-top:0;padding-top:4px}
.mapbox{border:0;box-shadow:var(--shadow)}
.banner{border:0}
.tagchip{background:var(--bluetint);border-color:transparent}
.btn.ghost{border-color:var(--line)}


:root{--bg:#fcf8ee;--sky:#fcf8ee;--shadow:0 1px 2px rgba(60,45,10,.05),0 10px 30px rgba(60,45,10,.07)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161d;--sky:#12161d}}
:root[data-theme="dark"]{--bg:#12161d;--sky:#12161d}
body{background:var(--bg)}
nav{background:var(--bg);box-shadow:0 1px 0 #efe6cf;border-radius:0}
.scene{background:var(--bg)}
.card,.panel,.side,.stats div{border:1px solid #efe6cf}
.facts{background:#f7efd9}

/* ---- single-surface: no white-on-cream mixing ---- */
.card,.panel,.side,.stats div{background:transparent;box-shadow:none;border:1px solid #e8dfc7;border-radius:16px}
.facts{background:transparent;border:0;border-top:1px solid #e8dfc7;border-bottom:1px solid #e8dfc7;border-radius:0;padding:14px 0}
.btn.ghost,.chip,.save,input,select,textarea{background:transparent}
.btn.ghost{border:1px solid #cfc5a8;color:var(--ink)}
.btn.ghost:hover{background:#f3ead2;color:var(--ink)}
.chip{border:1px solid #d8cfb4}.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input,select,textarea{border:1px solid #d8cfb4}
.tagchip{background:transparent;border:1px solid #d8cfb4}
.why{background:#f6eed8}.why.no{background:#f6eed8}
.pill.off{background:#f6eed8}
.plist button{background:transparent;border:1px solid #e8dfc7}
.mapbox{box-shadow:none;border:1px solid #e8dfc7}
.scene{border-radius:20px}
.banner{background:transparent;border:1px solid #e8dfc7}
.detail h3{border-top:0}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .card,:root:not([data-theme="light"]) .panel,:root:not([data-theme="light"]) .side{border-color:#2a3342}}
:root[data-theme="dark"] .card,:root[data-theme="dark"] .panel,:root[data-theme="dark"] .side{border-color:#2a3342}

/* ---- editorial print style ---- */
:root{--bg:#f6f2e8;--sky:#f6f2e8;--ink:#18181b;--sub:#5d5a52;--line:#ddd5c0;--serif:"Newsreader","Iowan Old Style",Georgia,serif}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141412;--sky:#141412;--ink:#f1ede2;--sub:#a29d90;--line:#2d2b26}}
:root[data-theme="dark"]{--bg:#141412;--sky:#141412;--ink:#f1ede2;--sub:#a29d90;--line:#2d2b26}
body{background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,sans-serif}
h1,h2,h3,.brand{font-family:var(--serif);font-weight:500;letter-spacing:-.015em}
h2{font-size:clamp(1.9rem,4vw,2.6rem);line-height:1.1}
nav{max-width:none;margin:0 -24px 8px;padding:0 max(24px,calc((100vw - 1040px)/2));height:68px;flex-wrap:nowrap;gap:26px;background:var(--bg);border-bottom:1px solid var(--line);box-shadow:none;border-radius:0}
nav .brand{font-family:var(--serif);font-size:1.45rem;font-weight:600;margin-right:0;flex:none;letter-spacing:-.02em}
#navtabs{flex:1;display:flex;align-items:center;gap:6px;height:100%;min-width:0}
nav button.tab{height:100%;padding:0 12px;border:0;border-radius:0;background:none;color:var(--sub);font-size:.95rem;font-weight:500;display:flex;align-items:center;white-space:nowrap}
nav button.tab:hover{color:var(--ink)}nav button.tab.on{color:var(--ink);background:none;border-bottom:2px solid var(--ink)}
.btn{border-radius:999px;font-weight:600;background:var(--ink);color:var(--bg);border:1px solid var(--ink);box-shadow:none}
.btn:hover{background:var(--ink);opacity:.86;color:var(--bg)}
.btn.ghost,.btn.plain{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.ghost:hover,.btn.plain:hover{background:transparent;border-color:var(--ink);opacity:1;color:var(--ink)}
#navtabs .btn.sm.ghost{margin-left:auto;border:0}#navtabs .btn.sm:not(.ghost){margin-left:0}
.card,.panel,.side,.stats div,.banner,.mapbox{background:transparent;border:1px solid var(--line);box-shadow:none;border-radius:6px}
.card h3{font-size:1.5rem}
.facts{border-color:var(--line)}.chip{border-radius:999px;border:1px solid var(--line);background:transparent}.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tagchip{border-radius:999px;background:transparent;border:1px solid var(--line);color:var(--sub)}
.why,.why.no,.pill.off{background:transparent;border:0;border-left:2px solid #c58a00;border-radius:0;padding:2px 10px}
.amt{font-family:var(--serif)}
a.lnk,.lnk{color:var(--ink);text-decoration-color:#c58a00}
.hero{text-align:center;padding:84px 0 40px;max-width:820px;margin:0 auto}
.eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--sub);margin:0 0 18px;font-weight:600}
.hero h1{font-size:clamp(2.5rem,6.6vw,4.6rem);line-height:1.04;margin:0 auto;max-width:15ch;position:relative}
.uw{display:block;width:min(420px,70%);margin:6px auto 0}.ul{display:block;width:100%;height:20px}
.hero .sub{font-size:1.15rem;line-height:1.6;color:var(--sub);max-width:52ch;margin:26px auto 30px}
.hero .cta{justify-content:center;display:flex;gap:12px;flex-wrap:wrap}.btn.big{padding:15px 28px;font-size:1rem}
.hero p,.closing p{border:0}.small{color:var(--sub);font-size:.85rem;margin-top:22px}
.orn{display:block;width:120px;margin:36px auto;color:var(--ink)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;max-width:980px;margin:20px auto 20px;border-top:1px solid var(--line);padding-top:44px}
.trio h3{font-size:1.5rem;margin:0 0 10px}.trio p{color:var(--sub);margin:0;line-height:1.65}
.closing{text-align:center;border-top:1px solid var(--line);margin:56px auto 40px;padding-top:64px;max-width:820px}.closing h2{margin:0 0 24px}
@media(max-width:720px){.trio{grid-template-columns:1fr;gap:28px}.hero{padding-top:44px}nav{gap:6px;height:58px}nav .brand{font-size:1.15rem}nav button.tab{padding:0 7px;font-size:.8rem;flex:none}#navtabs .btn.sm{padding:0 10px;font-size:.78rem;height:32px;flex:none}}
@media(max-width:480px){nav .brand{display:none}}

/* ---- map in editorial palette ---- */
:root{--sea:#f6f2e8;--sea2:#e4dcc6;--land:#e8dfc8;--landedge:#8c846c;--pin:#c58a00;--pinoff:#a39b84;--pinedge:#18181b;--mapink:#18181b;--label:#7b7563}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--sea:#141412;--sea2:#24221d;--land:#26241e;--landedge:#5e5949;--pinoff:#6f6a5c;--pinedge:#f1ede2;--mapink:#f1ede2;--label:#a29d90}}
:root[data-theme="dark"]{--sea:#141412;--sea2:#24221d;--land:#26241e;--landedge:#5e5949;--pinoff:#6f6a5c;--pinedge:#f1ede2;--mapink:#f1ede2;--label:#a29d90}
.mapbox{--blue:var(--ink);background:var(--sea);border-radius:6px;border:1px solid var(--line)}
.mapbox text{font-family:var(--serif)}
.pin .ring{stroke:var(--ink)}
#mapwrap button.chip,.pin:focus-visible{outline-color:var(--ink)}
.plist button{border-radius:6px;background:transparent}.plist button.on{box-shadow:inset 0 0 0 1.5px var(--ink)}
.plist button b{font-family:var(--serif);font-weight:600;font-size:1.05rem}

/* ---- share dialog ---- */
#sharebox{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.shback{position:absolute;inset:0;background:rgba(20,20,18,.45)}
.shcard{position:relative;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;width:min(440px,100%);padding:20px 22px 22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.shhead{display:flex;justify-content:space-between;align-items:center}.shhead b{font-family:var(--serif);font-size:1.4rem;font-weight:600}
.shhead .x{background:none;border:0;font-size:1.7rem;line-height:1;color:var(--sub);cursor:pointer;padding:0 4px}
.shname{margin:4px 0 14px;color:var(--sub);font-size:.95rem;border:0;padding:0}
.shlink{display:flex;gap:8px}.shlink input{flex:1;min-width:0;font:inherit;font-size:.85rem;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink)}
.shopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:14px}
.shopt{display:block;text-align:center;padding:10px 12px;border:1px solid var(--line);border-radius:999px;color:var(--ink);text-decoration:none;font:inherit;font-weight:600;font-size:.9rem;background:transparent;cursor:pointer}
.shopt:hover{border-color:var(--ink)}
.sharebtn{margin-right:2px}

 const who=li([esc(yrText(o)),o.gpa!=null?`<b>GPA:</b> ${o.gpa%1===0?o.gpa.toFixed(1):o.gpa} ${/^pref/i.test(o.gpaRule||"")?"preferred":"minimum"}`:"<b>GPA:</b> no minimum listed",o.lor!=null?`<b>Letters of recommendation:</b> ${o.lor===0?"none required":o.lor}${o.lornote?" ("+esc(o.lornote)+")":""}`:"",o.cit?`<b>Citizenship:</b> ${/^yes/i.test(o.cit)?"U.S. citizenship required"+(/permanent/i.test(o.cit)?" (permanent residents also eligible)":""):/^no/i.test(o.cit)?"Not required":esc(o.cit)}`:"",aud.length?`<b>Open to:</b> ${aud.includes("External")&&aud.includes("Internal")?"Vanderbilt students and outside applicants":aud.includes("External")?"Outside applicants":"Vanderbilt students"}`:"",o.need?`<b>Need-based:</b> ${esc(o.need)}`:""]);
 const money2=li([amt(o)?`<b>Amount:</b> ${esc(amt(o))}`:"<b>Amount:</b> not stated",o.rb?`<b>Room &amp; board:</b> ${esc(o.rb)}`:"",o.fn?esc(o.fn):""]);
 const timing=li([`<b>Status:</b> ${esc(s.t)}`,o.opens?`<b>Application opens:</b> ${esc(o.opens)}`:(o.open?`<b>Application opens:</b> ${esc(fmt(o.open))}`:""),(o.terms||[]).length?`<b>Term:</b> ${esc(o.terms.join(", "))}`:"",o.dur?`<b>Length:</b> ${esc(o.dur)}`:"",o.region?`<b>Where:</b> ${esc(o.region)}`:"",esc(infoLine(o).replace(/&amp;/g,"&"))]);
 return`${back}<article class="detail"><div class="tags">${(o.cats||[]).map(c=>`<span class="tag g">${esc(c)}</span>`).join("")}${o.kind==="fund"?'<span class="tag">Funding only</span>':""}${o.intl?'<span class="tag">International</span>':""}</div>
 <h2>${esc(o.name)}</h2>${amt(o)?`<div class="amt" style="font-size:1.4rem">${esc(amt(o))}</div>`:""}
 <div class="dgrid"><div class="main"><h3>What it is</h3><p>${esc(o.about||"We don't have a description for this one yet. The program website below has the details.")}</p>
 ${(o.tags||[]).length?`<h3>Subjects</h3><div class="tagrow">${tagChips(o,20)}</div>`:""}<h3>Who can apply</h3><ul>${who}</ul><h3>The money</h3><ul>${money2}</ul><h3>Timing</h3><ul>${timing}</ul>
 ${att.length?fundList(att.map(f=>f.id)):""}
 ${(o.email||o.contact)?`<h3>Questions?</h3><p>${o.contact?esc(o.contact)+" · ":""}${o.email?`<a href="mailto:${esc(o.email)}">${esc(o.email)}</a>`:""}</p>`:""}
 ${o.id==="VU-015"?'<div class="actions"><button class="btn sm ghost" data-v="map">See the programs on the map</button></div>':""}</div>${linksBox(o)}</div></article>`}

/* ---------- analytics (shared database; viewers who can write are counted) ---------- */
let DB=null,UID=null;const Q=[];
const safe=x=>String(x).replace(/[^A-Za-z0-9_\-.~:@+]/g,"_");
function track(type,item,extra){const ev={type,item:item||null,t:Date.now(),u:UID,...(extra||{})};if(DB&&UID)send(ev);else Q.push(ev)}
function send(ev){if(!DB||!UID)return;try{const su=ev.type==="signup",p=DB.collection((su?"signups/":"clicks/")+safe(UID)+(su?"/items":"/events")).add(ev);p&&p.catch&&p.catch(()=>{})}catch(e){}}
async function initTracking(){try{if(!(window.claude&&claude.use))return;
 const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);if(!db)return;DB=db;
 try{S.admin=user?await user.canEdit():false}catch(e){}
 try{UID=user?await user.id():null}catch(e){}
 if(S.admin)$("#navtabs").innerHTML=navHTML();
 if(UID){const ref=DB.doc("visits/"+safe(UID));try{const snap=await ref.get(),d=snap.exists?snap.data():null;await ref.set({first:d?d.first:Date.now(),last:Date.now(),n:(d?d.n:0)+1})}catch(e){}}
 while(Q.length)send(Q.shift())}catch(e){}}
document.addEventListener("click",e=>{const a=e.target.closest&&e.target.closest("a[data-track]");if(a)track(a.dataset.track,a.dataset.item)});
document.addEventListener("auxclick",e=>{const a=e.target.closest&&e.target.closest("a[data-track]");if(a&&e.button===1)track(a.dataset.track,a.dataset.item)});
function stats(){return`<h2>Site stats</h2><p class="muted" style="max-width:64ch">Counts from people who opened this site while signed in with permission to write to its shared database. People who can only view the page can't be counted.</p><div id="statsbody"><p class="muted">Loading…</p></div><div class="actions"><button class="btn sm ghost" data-act="refreshstats">Refresh</button></div>`}
async function loadStats(){const el=$("#statsbody");if(!el)return;if(!DB){el.innerHTML='<p class="muted">The shared database isn\'t available in this view, so there are no counts to show.</p>';return}
 try{const v=await DB.collection("visits").get(),ids=v.docs.map(d=>d.id),V=v.docs.map(d=>d.data()),G=[],C=[];
  for(let i=0;i<ids.length;i+=8){await Promise.all(ids.slice(i,i+8).map(async id=>{const [g,c]=await Promise.all([DB.collection("signups/"+id+"/items").get(),DB.collection("clicks/"+id+"/events").get()]);g.docs.forEach(d=>G.push(d.data()));c.docs.forEach(d=>C.push(d.data()))}))}
  const prog=C.filter(x=>x.type==="program"),app=C.filter(x=>x.type==="apply");
  const uniq=a=>new Set(a.map(x=>x.u||"anon")).size;
  const top=a=>{const m={};a.forEach(x=>m[x.item]=(m[x.item]||0)+1);return Object.entries(m).sort((x,y)=>y[1]-x[1]).slice(0,10)};
  const nm=id=>ITEMS[id]?ITEMS[id].name:id;
  const tbl=a=>a.length?`<table class="t"><tr><th>Opportunity</th><th>Clicks</th></tr>${top(a).map(([id,n])=>`<tr><td>${esc(nm(id))}</td><td>${n}</td></tr>`).join("")}</table>`:'<p class="muted">None yet.</p>';
  const notify=G.filter(x=>x.notify);
  el.innerHTML=`<div class="stats"><div><b>${V.length}</b><span>people have visited</span></div><div><b>${V.reduce((s,x)=>s+(x.n||0),0)}</b><span>total visits</span></div><div><b>${G.length}</b><span>accounts created</span></div><div><b>${notify.length}</b><span>asked to be notified of new opportunities</span></div><div><b>${prog.length}</b><span>program website clicks (${uniq(prog)} people)</span></div><div><b>${app.length}</b><span>application clicks (${uniq(app)} people)</span></div><div><b>${C.filter(x=>x.type==="share").length}</b><span>shares</span></div></div>
  <h3 style="margin-top:22px">Most-clicked program websites</h3>${tbl(prog)}<h3>Most-clicked applications</h3>${tbl(app)}
  <h3>People waiting for notifications (${notify.length})</h3>${notify.length?`<table class="t"><tr><th>Email</th><th>Signed up</th></tr>${notify.sort((a,b)=>b.t-a.t).map(x=>`<tr><td>${esc(x.email||"")}</td><td>${esc(new Date(x.t).toLocaleDateString())}</td></tr>`).join("")}</table>`:'<p class="muted">None yet.</p>'}`}
 catch(e){el.innerHTML='<p class="muted">Couldn\'t load the counts. You may not have access to this data.</p>'}}

/* ---------- sharing ---------- */
function shareURL(id){let b="";try{b=location.href.split("#")[0]}catch(e){}return b+"#o="+encodeURIComponent(id)}
function shareText(id){const o=ITEMS[id];return(o?o.name:"This opportunity")+" - a Vanderbilt summer opportunity on Broader Horizons"}
function closeShare(){const d=document.getElementById("sharebox");if(d)d.remove();if(S.shareFrom&&S.shareFrom.isConnected)S.shareFrom.focus();S.shareFrom=null}
function openShare(id,from){closeShare();S.shareFrom=from||null;const u=shareURL(id),tx=shareText(id),eu=encodeURIComponent(u),et=encodeURIComponent(tx);
 const L=(k,l,h,ic)=>`<a class="shopt" href="${h}" target="_blank" rel="noopener" data-via="${k}">${l}</a>`;
 const d=document.createElement("div");d.id="sharebox";d.setAttribute("role","dialog");d.setAttribute("aria-modal","true");d.setAttribute("aria-label","Share this opportunity");
 d.innerHTML=`<div class="shback" data-shclose></div><div class="shcard"><div class="shhead"><b>Share</b><button class="x" data-shclose aria-label="Close">&times;</button></div><p class="shname">${esc(ITEMS[id]?ITEMS[id].name:"")}</p>
 <div class="shlink"><input id="shurl" readonly value="${esc(u)}" aria-label="Link"><button class="btn sm" data-copy="${esc(id)}">Copy link</button></div><p class="muted" id="shmsg" role="status" style="margin:6px 0 0;min-height:1.2em"></p>
 <div class="shopts">${L("email","Email","mailto:?subject="+et+"&body="+et+"%0A%0A"+eu)}${L("sms","Text message","sms:?&body="+et+"%20"+eu)}${L("whatsapp","WhatsApp","https://wa.me/?text="+et+"%20"+eu)}${L("x","X","https://twitter.com/intent/tweet?text="+et+"&url="+eu)}${L("linkedin","LinkedIn","https://www.linkedin.com/sharing/share-offsite/?url="+eu)}${navigator.share?`<button class="shopt" data-native="${esc(id)}">More…</button>`:""}</div></div>`;
 document.body.appendChild(d);const i=d.querySelector("#shurl");i.focus();i.select()}
async function copyShare(id){const u=shareURL(id),m=document.getElementById("shmsg");let ok=false;try{await navigator.clipboard.writeText(u);ok=true}catch(e){try{const i=document.getElementById("shurl");i.select();ok=document.execCommand("copy")}catch(x){}}
 if(m)m.textContent=ok?"Link copied.":"Couldn't copy automatically. The link is selected, so press Ctrl/Cmd+C.";if(ok)track("share",id,{via:"copy"})}
document.addEventListener("click",e=>{
 const sh=e.target.closest("[data-share]");if(sh){e.preventDefault();S.shareId=sh.dataset.share;openShare(sh.dataset.share,sh);return}
 if(e.target.closest("[data-shclose]")){closeShare();return}
 const cp=e.target.closest("[data-copy]");if(cp){copyShare(cp.dataset.copy);return}
 const nv=e.target.closest("[data-native]");if(nv){const id=nv.dataset.native;navigator.share({title:shareText(id),text:shareText(id),url:shareURL(id)}).then(()=>track("share",id,{via:"native"})).catch(()=>{});return}
 const via=e.target.closest("a[data-via]");if(via){const b=document.getElementById("shurl");track("share",S.shareId||null,{via:via.dataset.via})}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeShare()});
function openFromHash(){const m=(location.hash||"").match(/^#o=(.+)$/);if(!m)return false;const id=decodeURIComponent(m[1]);if(!ITEMS[id])return false;S.back={v:"find",tab:"all",y:0};S.d=id;S.v="detail";return true}
window.addEventListener("hashchange",()=>{if(openFromHash())render()});
/* ---------- events ---------- */
document.addEventListener("click",e=>{
 const pin=e.target.closest("[data-pin]");if(pin){S.sel=S.sel===pin.dataset.pin?null:pin.dataset.pin;drawMap();return}
 const t=e.target.closest("button");if(!t)return;
 if(t.dataset.save){const id=t.dataset.save,L=SAVEDL(),i=L.indexOf(id);i<0?L.push(id):L.splice(i,1);persist();
  document.querySelectorAll(`[data-save="${CSS.escape(id)}"]`).forEach(b=>{b.setAttribute("aria-pressed",isSaved(id));b.querySelector("span").textContent=isSaved(id)?"Saved":"Save for later"});
  $("#navtabs").innerHTML=navHTML();if(S.v==="saved"){S.keep=true;render()}return}
 if(t.dataset.auth){S.auth=t.dataset.auth;S.msg="";S.v="account";return render()}
 if(t.dataset.v){S.v=t.dataset.v;S.msg="";S.draft=null;return render()}
 if(t.dataset.tag!==undefined){S.f.q=t.dataset.tag;S.f.cats=[];S.v="find";S.tab="all";S.msg="";return render()}
 if(t.dataset.tab){S.tab=t.dataset.tab;return render()}
 if(t.dataset.clear){S.sel=null;return drawMap()}
 if(t.dataset.open){S.back={v:S.v,tab:S.tab,y:window.scrollY};S.d=t.dataset.open;S.v="detail";return render()}
 if(t.dataset.back!==undefined){const b=S.back||{v:"find",tab:"all",y:0};S.v=b.v;S.tab=b.tab||S.tab;S.keep=true;render();window.scrollTo(0,b.y||0);return}
 if(t.dataset.region){S.region=t.dataset.region;document.querySelectorAll("[data-region]").forEach(b=>b.classList.toggle("on",b.dataset.region===S.region));return drawMap()}
 if(t.dataset.prog){S.sel=S.sel===t.dataset.prog?null:t.dataset.prog;if(S.sel&&!shown(ITEMS[S.sel])){S.region=regionFor(ITEMS[S.sel]);document.querySelectorAll('[data-region]').forEach(b=>b.classList.toggle('on',b.dataset.region===S.region))}return drawMap()}
 if(t.dataset.gomap){S.sel=t.dataset.gomap;if(!shown(ITEMS[S.sel]))S.region=regionFor(ITEMS[S.sel]);S.v="map";return render()}
 if(t.dataset.cat){const c=S.f.cats,i=c.indexOf(t.dataset.cat);i<0?c.push(t.dataset.cat):c.splice(i,1);S.keep=true;return render()}
 if(t.dataset.grade){syncDraft();S.draft.grade=+t.dataset.grade;S.msg="";S.keep=true;return render()}
 if(t.dataset.int){syncDraft();const L=S.draft.interests,i=L.indexOf(t.dataset.int);i<0?L.push(t.dataset.int):L.splice(i,1);S.msg="";S.keep=true;return render()}
 const a=t.dataset.act;
 if(a==="fs")toggleFS();
 if(a==="refreshstats")loadStats();
 if(a==="logout"){SESSION=null;persist();S.v="welcome";S.draft=null;render()}
 if(a==="saveprof"){syncDraft();const d=S.draft;USERS[SESSION].profile={gpa:d.gpa===""?null:d.gpa,grade:d.grade??null,majors:(d.majors||"").trim(),minors:(d.minors||"").trim(),interests:d.interests||[]};persist();S.msg="Profile saved.";S.keep=true;render()}});
function syncDraft(){const d=S.draft;if(!d||!$("#p-gpa"))return;const g=$("#p-gpa").value;d.gpa=g===""?null:+g;d.majors=$("#p-maj").value;d.minors=$("#p-min").value}
document.addEventListener("submit",async e=>{if(e.target.id!=="f-auth")return;e.preventDefault();
 const email=$("#a-email").value.trim().toLowerCase(),pw=$("#a-pw").value,up=S.auth==="up",err=m=>{S.msg=m;$("#a-err").textContent=m};
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))return err("Enter a valid email address.");
 if(up&&pw.length<8)return err("Use a password with at least 8 characters.");
 if(!pw)return err("Enter your password.");
 if(!(window.crypto&&crypto.subtle))return err("This browser can't create accounts here.");
 try{if(up){if(USERS[email])return err("That email already has an account. Log in instead.");const h=await derive(pw);const nt=!!($("#a-notify")&&$("#a-notify").checked);USERS[email]={salt:h.salt,hash:h.hash,profile:null,notify:nt,saved:[...(GUEST.saved||[])]};SESSION=email;track("signup",null,{notify:nt,email:nt?email:null});persist();S.msg="";S.draft=null;render()}
 else{const u=USERS[email];if(!u)return err("No account found for that email.");const h=await derive(pw,u.salt);if(h.hash!==u.hash)return err("That password doesn't match.");SESSION=email;persist();S.msg="";S.draft=null;S.v="find";S.tab="sug";render()}}
 catch(x){err("Something went wrong. Try again.")}});
document.addEventListener("keydown",e=>{const pin=e.target.closest&&e.target.closest("[data-pin]");if(pin&&(e.key==="Enter"||e.key===" ")){e.preventDefault();S.sel=S.sel===pin.dataset.pin?null:pin.dataset.pin;drawMap()}
 if(e.key==="Escape"&&S.fs&&!document.fullscreenElement)toggleFS()});
document.addEventListener("input",e=>{if(S.v!=="find"||S.tab!=="all")return;const i=e.target.id;if(i==="q"){S.f.q=e.target.value;const pos=e.target.selectionStart;S.keep=true;render();const n=$("#"+i);n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}});
document.addEventListener("change",e=>{if(S.v!=="find"||S.tab!=="all")return;const i=e.target.id,m={"sel-term":"term","sel-lor":"lor"};S.keep=true;if(m[i]){S.f[m[i]]=e.target.value;render()}if(i==="intl"){S.f.intl=e.target.checked;render()}if(i==="hide"){S.f.hide=e.target.checked;render()}});
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{if(S.v==="map")drawMap()},150)});
openFromHash();render();initTracking();
</script>
